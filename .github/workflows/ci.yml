name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install Pillow imageio-ffmpeg av ruff
      - run: python scripts/audit_release.py --root .
      - run: python -m compileall -q scripts tests
      - run: python -m ruff check scripts tests
      - run: python -m unittest discover -s tests -v
      - name: Validate shell installer syntax
        run: bash -n install.sh
